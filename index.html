
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#534AB7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  background: #f6f6fb;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  justify-content: center;
}

.order-wrap {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  padding: 16px 16px 110px;
  box-sizing: border-box;
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.logo {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #534AB7;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.section-card {
  background: white;
  border: 1px solid #ececf2;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
}

.section-title {
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 12px;
  color: #777;
  text-transform: uppercase;
}

.field-wrap {
  margin-bottom: 12px;
}

.field-label {
  font-size: 13px;
  margin-bottom: 6px;
  color: #666;
}

.text-input,
.note-input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #ddd;
  border-radius: 12px;
  box-sizing: border-box;
}

.note-input {
  resize: none;
  height: 70px;
}

.option-btn {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid #ddd;
  background: white;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  font-size: 15px;
}

.option-btn.selected {
  border: 2px solid #534AB7;
  background: #eeedfe;
}

.badge-min {
  background: #fac775;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
}

.ala-section {
  display: none;
}

.ala-section.visible {
  display: block;
}

.menu-row {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid #f0f0f0;
}

.menu-row:last-child {
  border-bottom: none;
}

.menu-name {
  font-size: 15px;
}

.menu-price {
  font-size: 12px;
  color: #777;
}

.qty-ctrl {
  display: flex;
  align-items: center;
  gap: 10px;
}

.qty-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: #534AB7;
  color: white;
  font-size: 18px;
}

.qty-num {
  min-width: 18px;
  text-align: center;
}

.total-box {
  bottom: 82px;
  background: #eeedfe;
  border-radius: 16px;
  padding: 16px;
  display: flex;
  justify-content: space-between;
  margin-top: 14px;
  margin-bottom: 12px;
}

.total-label {
  color: #534AB7;
}

.total-amount {
  font-size: 22px;
  font-weight: bold;
  color: #3c3489;
}

.submit-wrap {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: white;
  border-top: 1px solid #eee;
  padding: 12px;
}

.submit-inner {
  max-width: 480px;
  margin: auto;
}

.submit-btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 14px;
  background: #534AB7;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.submit-btn:active {
  transform: scale(0.98);
}
</style>

<div class="order-wrap">
  <div class="header">
    <div class="logo">SWA</div>
    <div>
      <div style="font-size: 18px; font-weight: 500; color: var(--color-text-primary);">SWA Canteen</div>
      <div style="font-size: 13px; color: var(--color-text-secondary);">Form pemesanan online</div>
    </div>
  </div>

  <div class="section-card">
    <p class="section-title">Data pemesan</p>
    <div class="field-wrap">
      <p class="field-label">Nama lengkap</p>
      <input class="text-input" type="text" id="nama" placeholder="Masukkan nama lengkap..." />
    </div>
    <div class="field-wrap">
      <p class="field-label">Nomor HP</p>
      <input class="text-input" type="tel" id="nohp" placeholder="Contoh: 08123456789" />
    </div>
    <div class="field-wrap">
      <p class="field-label">Catatan tambahan (opsional)</p>
      <textarea class="note-input" id="catatan" placeholder="Misal: tidak pedas, tanpa santan, dll..."></textarea>
    </div>
  </div>

  <div class="section-card">
    <p class="section-title">Pilih jenis pesanan</p>
    <button class="option-btn" id="btn-set" onclick="pilih('set')">
      <span>Menu Set <span style="font-size:12px;color:#888;font-weight:400">(sudah lengkap)</span></span>
      <span class="price">Rp 40.000</span>
    </button>
    <p class="set-info" id="set-info">Harga sudah termasuk paket menu lengkap dari SWA Canteen.</p>
    <button class="option-btn" id="btn-ala" onclick="pilih('ala')">
      <span>Ala Carte <span class="badge-min">min. 1 item</span></span>
      <span class="price">pilih sendiri</span>
    </button>
  </div>

  <div class="section-card ala-section" id="ala-section">
    <p class="section-title">Pilih menu satuan</p>
    <p class="min-note">Bisa pilih 1 item atau mix & match beberapa sekaligus!</p>
    <div id="menu-list"></div>
  </div>

  <div class="total-box">
    <span class="total-label">Total harga</span>
    <span class="total-amount" id="total-display">Rp 0</span>
  </div>

  <button class="submit-btn" onclick="submit()">Konfirmasi pesanan ↗</button>
</div>

<script>
let menus = [];

async function loadMenus() {
  const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSBb-6HNuXJHxpNQmElTRbRU0y6YCDe09JJjUAschQWKBUhtCNS2TzWc6IwaVjRjgETU0TOba3g-b-J/pub?gid=0&single=true&output=csv";

  const res = await fetch(url);
  const text = await res.text();

  const rows = text.split(/\r?\n/).slice(1); // skip header

menus = rows
  .map(row => {
    const [nama, harga] = row.split(",");
    if (!nama || !harga) return null;

    return {
      nama: nama.trim(),
      harga: Number(harga.trim()) // 👈 tambah trim
    };
  })
  .filter(Boolean);

qty = new Array(menus.length).fill(0);
renderMenus();
}

let mode = null;
let qty = [];

function fmt(n) {
  return "Rp " + n.toLocaleString("id-ID");
}

function pilih(m) {
  mode = m;
  document.getElementById("btn-set").classList.toggle("selected", m === "set");
  document.getElementById("btn-ala").classList.toggle("selected", m === "ala");
  document.getElementById("set-info").classList.toggle("visible", m === "set");
  const sec = document.getElementById("ala-section");
  if (m === "ala") {
    sec.classList.add("visible");
  } else {
    sec.classList.remove("visible");
    qty = new Array(menus.length).fill(0);
    renderMenus();
  }
  hitung();
}

function renderMenus() {
  const list = document.getElementById("menu-list");
  list.innerHTML = menus.map((m, i) => `
    <div class="menu-row">
      <div>
        <div class="menu-name">${m.nama}</div>
        <div class="menu-price">${fmt(m.harga)} / porsi</div>
      </div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="ubahQty(${i}, -1)">−</button>
        <span class="qty-num" id="qty-${i}">0</span>
        <button class="qty-btn" onclick="ubahQty(${i}, 1)">+</button>
      </div>
    </div>
  `).join("");
}

function ubahQty(i, d) {
  qty[i] = Math.max(0, qty[i] + d);
  document.getElementById("qty-" + i).textContent = qty[i];
  hitung();
}

function hitung() {
  let total = 0;
  if (mode === "set") {
    total = 40000;
  } else if (mode === "ala") {
    total = menus.reduce((s, m, i) => s + m.harga * qty[i], 0);
  }
  document.getElementById("total-display").textContent = fmt(total);
}

function submit() {
  const nama = document.getElementById("nama").value.trim();
  const nohp = document.getElementById("nohp").value.trim();
  const catatan = document.getElementById("catatan").value.trim();

  if (!nama) { alert("Isi nama lengkap dulu ya!"); return; }
  if (!nohp) { alert("Isi nomor HP dulu ya!"); return; }
  if (!/^[0-9+\-\s]{8,15}$/.test(nohp)) { alert("Nomor HP tidak valid, cek lagi ya!"); return; }
  if (!mode) { alert("Pilih jenis pesanan dulu!"); return; }
  if (mode === "ala" && qty.every(q => q === 0)) { alert("Pilih minimal 1 menu ala carte!"); return; }

  let detail = "";
  if (mode === "set") {
    detail = "Menu Set – Rp 40.000";
  } else {
    detail = menus.filter((m, i) => qty[i] > 0).map((m, i) => `${m.nama} x${qty[i]} (${fmt(m.harga * qty[i])})`).join(", ");
  }

  const total = mode === "set" ? 40000 : menus.reduce((s, m, i) => s + m.harga * qty[i], 0);
  const catatanTeks = catatan ? ` | Catatan: ${catatan}` : "";
  const message = `🧾 *Pesanan SWA Canteen*
👤 Nama: ${nama}
📞 HP: ${nohp}

🛒 Detail Pesanan:
${detail}

💰 Total: ${fmt(total)}
${catatan ? `\n📝 Catatan: ${catatan}` : ""}`;

const url = `https://wa.me/6285712172240?text=${encodeURIComponent(message)}`;

alert("Kamu akan diarahkan ke WhatsApp untuk konfirmasi pesanan ya 👍");
window.open(url, "_blank");

}

loadMenus();
</script>
