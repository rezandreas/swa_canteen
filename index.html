
<style>
  .order-wrap { max-width: 480px; margin: 1.5rem auto; font-family: var(--font-sans); }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; }
  .logo { width: 44px; height: 44px; border-radius: 50%; background: #534AB7; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: white; flex-shrink: 0; }
  .section-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
  .section-title { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 1rem; }
  .field-label { font-size: 13px; color: var(--color-text-secondary); margin: 0 0 6px; }
  .field-wrap { margin-bottom: 12px; }
  .field-wrap:last-child { margin-bottom: 0; }
  .text-input { width: 100%; padding: 10px 12px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); font-size: 14px; background: var(--color-background-secondary); color: var(--color-text-primary); box-sizing: border-box; }
  .text-input:focus { outline: none; border-color: #534AB7; }
  .note-input { width: 100%; padding: 10px 12px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); font-size: 14px; background: var(--color-background-secondary); color: var(--color-text-primary); box-sizing: border-box; resize: none; height: 64px; }
  .note-input:focus { outline: none; border-color: #534AB7; }
  .option-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 12px 16px; margin-bottom: 8px; background: var(--color-background-secondary); border: 1.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); cursor: pointer; font-size: 15px; color: var(--color-text-primary); transition: border-color 0.15s, background 0.15s; }
  .option-btn:hover { border-color: var(--color-border-secondary); }
  .option-btn.selected { border-color: #534AB7; background: #EEEDFE; color: #3C3489; }
  .option-btn .price { font-size: 13px; color: var(--color-text-secondary); font-weight: 500; }
  .option-btn.selected .price { color: #534AB7; }
  .menu-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .menu-row:last-child { border-bottom: none; }
  .menu-name { font-size: 14px; color: var(--color-text-primary); }
  .menu-price { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
  .qty-ctrl { display: flex; align-items: center; gap: 10px; }
  .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--color-border-secondary); background: var(--color-background-primary); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--color-text-primary); line-height: 1; }
  .qty-btn:hover { background: var(--color-background-secondary); }
  .qty-num { font-size: 15px; font-weight: 500; min-width: 20px; text-align: center; color: var(--color-text-primary); }
  .total-box { background: #EEEDFE; border-radius: var(--border-radius-lg); padding: 1.25rem; display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .total-label { font-size: 14px; color: #534AB7; font-weight: 500; }
  .total-amount { font-size: 24px; font-weight: 500; color: #3C3489; }
  .submit-btn { width: 100%; padding: 14px; background: #534AB7; color: white; border: none; border-radius: var(--border-radius-md); font-size: 15px; font-weight: 500; cursor: pointer; }
  .submit-btn:hover { background: #3C3489; }
  .ala-section { display: none; }
  .ala-section.visible { display: block; }
  .min-note { font-size: 12px; color: var(--color-text-secondary); margin: 0 0 12px; }
  .badge-min { font-size: 11px; background: #FAC775; color: #633806; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
  .set-info { font-size: 13px; color: var(--color-text-secondary); margin: 8px 0 0; display: none; }
  .set-info.visible { display: block; }
</style>

<div class="order-wrap">
  <div class="header">
    <div class="logo">SWA</div>
    <div>
      <div style="font-size: 18px; font-weight: 500; color: var(--color-text-primary);">SWA Canteen</div>
      <div style="font-size: 13px; color: var(--color-text-secondary);">Form pemesanan online</div>
    </div>
  </div>

  <div class="section-card">
    <p class="section-title">Data pemesan</p>
    <div class="field-wrap">
      <p class="field-label">Nama lengkap</p>
      <input class="text-input" type="text" id="nama" placeholder="Masukkan nama lengkap..." />
    </div>
    <div class="field-wrap">
      <p class="field-label">Nomor HP</p>
      <input class="text-input" type="tel" id="nohp" placeholder="Contoh: 08123456789" />
    </div>
    <div class="field-wrap">
      <p class="field-label">Catatan tambahan (opsional)</p>
      <textarea class="note-input" id="catatan" placeholder="Misal: tidak pedas, tanpa santan, dll..."></textarea>
    </div>
  </div>

  <div class="section-card">
    <p class="section-title">Pilih jenis pesanan</p>
    <button class="option-btn" id="btn-set" onclick="pilih('set')">
      <span>Menu Set <span style="font-size:12px;color:#888;font-weight:400">(sudah lengkap)</span></span>
      <span class="price">Rp 40.000</span>
    </button>
    <p class="set-info" id="set-info">Harga sudah termasuk paket menu lengkap dari SWA Canteen.</p>
    <button class="option-btn" id="btn-ala" onclick="pilih('ala')">
      <span>Ala Carte <span class="badge-min">min. 1 item</span></span>
      <span class="price">pilih sendiri</span>
    </button>
  </div>

  <div class="section-card ala-section" id="ala-section">
    <p class="section-title">Pilih menu satuan</p>
    <p class="min-note">Bisa pilih 1 item atau mix & match beberapa sekaligus!</p>
    <div id="menu-list"></div>
  </div>

  <div class="total-box">
    <span class="total-label">Total harga</span>
    <span class="total-amount" id="total-display">Rp 0</span>
  </div>

  <button class="submit-btn" onclick="submit()">Konfirmasi pesanan ↗</button>
</div>

<script>
let menus = [];

async function loadMenus() {
  const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSBb-6HNuXJHxpNQmElTRbRU0y6YCDe09JJjUAschQWKBUhtCNS2TzWc6IwaVjRjgETU0TOba3g-b-J/pub?gid=0&single=true&output=csv";

  const res = await fetch(url);
  const text = await res.text();

  const rows = text.split(/\r?\n/).slice(1); // skip header

menus = rows
  .map(row => {
    const [nama, harga] = row.split(",");
    if (!nama || !harga) return null;

    return {
      nama: nama.trim(),
      harga: Number(harga.trim()) // 👈 tambah trim
    };
  })
  .filter(Boolean);

qty = new Array(menus.length).fill(0);
renderMenus();
}

let mode = null;
let qty = [];

function fmt(n) {
  return "Rp " + n.toLocaleString("id-ID");
}

function pilih(m) {
  mode = m;
  document.getElementById("btn-set").classList.toggle("selected", m === "set");
  document.getElementById("btn-ala").classList.toggle("selected", m === "ala");
  document.getElementById("set-info").classList.toggle("visible", m === "set");
  const sec = document.getElementById("ala-section");
  if (m === "ala") {
    sec.classList.add("visible");
  } else {
    sec.classList.remove("visible");
    qty = new Array(menus.length).fill(0);
    renderMenus();
  }
  hitung();
}

function renderMenus() {
  const list = document.getElementById("menu-list");
  list.innerHTML = menus.map((m, i) => `
    <div class="menu-row">
      <div>
        <div class="menu-name">${m.nama}</div>
        <div class="menu-price">${fmt(m.harga)} / porsi</div>
      </div>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="ubahQty(${i}, -1)">−</button>
        <span class="qty-num" id="qty-${i}">0</span>
        <button class="qty-btn" onclick="ubahQty(${i}, 1)">+</button>
      </div>
    </div>
  `).join("");
}

function ubahQty(i, d) {
  qty[i] = Math.max(0, qty[i] + d);
  document.getElementById("qty-" + i).textContent = qty[i];
  hitung();
}

function hitung() {
  let total = 0;
  if (mode === "set") {
    total = 40000;
  } else if (mode === "ala") {
    total = menus.reduce((s, m, i) => s + m.harga * qty[i], 0);
  }
  document.getElementById("total-display").textContent = fmt(total);
}

function submit() {
  const nama = document.getElementById("nama").value.trim();
  const nohp = document.getElementById("nohp").value.trim();
  const catatan = document.getElementById("catatan").value.trim();

  if (!nama) { alert("Isi nama lengkap dulu ya!"); return; }
  if (!nohp) { alert("Isi nomor HP dulu ya!"); return; }
  if (!/^[0-9+\-\s]{8,15}$/.test(nohp)) { alert("Nomor HP tidak valid, cek lagi ya!"); return; }
  if (!mode) { alert("Pilih jenis pesanan dulu!"); return; }
  if (mode === "ala" && qty.every(q => q === 0)) { alert("Pilih minimal 1 menu ala carte!"); return; }

  let detail = "";
  if (mode === "set") {
    detail = "Menu Set – Rp 40.000";
  } else {
    detail = menus.filter((m, i) => qty[i] > 0).map((m, i) => `${m.nama} x${qty[i]} (${fmt(m.harga * qty[i])})`).join(", ");
  }

  const total = mode === "set" ? 40000 : menus.reduce((s, m, i) => s + m.harga * qty[i], 0);
  const catatanTeks = catatan ? ` | Catatan: ${catatan}` : "";
  const message = `🧾 *Pesanan SWA Canteen*
👤 Nama: ${nama}
📞 HP: ${nohp}

🛒 Detail Pesanan:
${detail}

💰 Total: ${fmt(total)}
${catatan ? `\n📝 Catatan: ${catatan}` : ""}`;

const url = `https://wa.me/6285712172240?text=${encodeURIComponent(message)}`;

alert("Kamu akan diarahkan ke WhatsApp untuk konfirmasi pesanan ya 👍");
window.open(url, "_blank");

}

loadMenus();
</script>
